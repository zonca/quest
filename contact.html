<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Contact Us - Quest Real Estate Services" />
    <title>Contact Us - Quest Real Estate Services</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&family=Playfair+Display:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Libraries -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
        crossorigin="anonymous" referrerpolicy="no-referrer" media="print" onload="this.media='all'" />
    <noscript>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
            integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
            crossorigin="anonymous" referrerpolicy="no-referrer" />
    </noscript>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="fixed-bg"></div>
    <div class="overlay-gradient"></div>

    <main>
        <section class="content-wrapper">
            <div class="container">
                <div class="compact-header">
                    <a href="index.html" class="back-button">
                        <span class="icon"><i class="fas fa-arrow-left"></i></span>
                        <span>Back to Home</span>
                    </a>

                    <img src="images/quest-logo-optimized.webp" alt="Quest Real Estate Services Logo" class="hero-logo"
                        width="800" height="380">
                </div>

                <div class="glass-panel">
                    <div class="text-content">
                        <h1>Contact Us</h1>
                        <form name="contact" method="POST" data-netlify="true" netlify netlify-honeypot="bot-field"
                            class="contact-form">
                            <input type="hidden" name="form-name" value="contact">

                            <p class="is-hidden">
                                <label>Do not fill this out if you are human: <input name="bot-field"></label>
                            </p>

                            <div class="field">
                                <label class="label" for="name">Name <span aria-hidden="true">*</span></label>
                                <div class="control">
                                    <input class="input" type="text" id="name" name="name" autocomplete="name" required>
                                </div>
                            </div>

                            <div class="field">
                                <label class="label" for="email">Email address <span aria-hidden="true">*</span></label>
                                <div class="control">
                                    <input class="input" type="email" id="email" name="email" autocomplete="email"
                                        required>
                                </div>
                            </div>

                            <div class="field">
                                <label class="label" for="phone">Phone number <span aria-hidden="true">*</span></label>
                                <div class="control">
                                    <input class="input" type="tel" id="phone" name="phone" autocomplete="tel" required>
                                </div>
                            </div>

                            <div class="field">
                                <label class="label" for="interest">Interest <span aria-hidden="true">*</span></label>
                                <div class="control">
                                    <div class="select is-fullwidth">
                                        <select id="interest" name="interest" required>
                                            <option value="">Select an interest</option>
                                            <option value="Home Sales">Home Sales</option>
                                            <option value="Investment Opportunities">Investment Opportunities</option>
                                            <option value="Property Management">Property Management</option>
                                            <option value="Other">Other</option>
                                        </select>
                                    </div>
                                </div>
                            </div>

                            <div class="field">
                                <label class="label" for="message">Message <span aria-hidden="true">*</span></label>
                                <div class="control">
                                    <textarea class="textarea" id="message" name="message" rows="6" required></textarea>
                                </div>
                            </div>

                            <div class="field">
                                <div class="control">
                                    <button class="button is-glass" type="submit">
                                        <span class="icon"><i class="fas fa-paper-plane"></i></span>
                                        <span>Send Message</span>
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="footer-custom">
        <div class="container">
            <div class="is-flex is-flex-wrap-wrap is-justify-content-center">
                <a href="https://maps.google.com/?q=7752%20FAY%20AVE%20SUITE%20J%20LA%20JOLLA%20CA%2092037"
                    target="_blank" rel="noopener" class="contact-info-item">
                    <span class="icon"><i class="fas fa-location-dot"></i></span>
                    <span>7752 Fay Ave · Suite J · La Jolla, CA 92037</span>
                </a>

                <a href="#" class="contact-info-item" data-phone="+18584155455" data-phone-label="(858) 415-5455">
                    <span class="icon"><i class="fas fa-phone"></i></span>
                    <span class="phone-text">(858) 415-5455</span>
                </a>

                <a href="#" class="contact-info-item" data-email-key="info">
                    <span class="icon"><i class="fas fa-envelope"></i></span>
                    <span class="email-text">Email us</span>
                </a>
            </div>

            <div class="footer-legal">
                <p>&copy; 2025 Quest Real Estate Services. All rights reserved.</p>
                <p><a href="privacy.html">Privacy Policy</a></p>
            </div>
        </div>
    </footer>

    <script src="email-obfuscate.js"></script>
</body>

</html>
