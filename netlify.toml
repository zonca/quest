[build]
  command = "npm run build"
  publish = "dist"

# Keep Netlify's post-processing enabled so CSS gets minified even if the build
# output changes in the future.
[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = true
  minify = true

[[redirects]]
  from = "/repair"
  to = "/maintenance-request.html"
  status = 301

[[redirects]]
  from = "/maintenance"
  to = "/maintenance-request.html"
  status = 301
